<script>
const tl=gsap.timeline({paused:true}), A=0.05;
casa.slam(tl,"#num",0.0);
for(let i=0;i<12;i++) tl.fromTo("#c"+i,{opacity:0,y:16},{opacity:1,y:0,duration:0.3,ease:"power3.out"},0.12+i*0.025);

for(let i=0;i<12;i++){const t=0.836-A+i*0.14;
  tl.to("#c"+i,{borderColor:"#F5C542",backgroundColor:"rgba(245,197,66,.18)",duration:0.12},t);
  tl.to("#c"+i+" b",{scale:1.1,duration:0.1,ease:"power2.out"},t); tl.to("#c"+i+" b",{scale:1,duration:0.04},t+0.1);}
