<!doctype html><html><head><meta charset="utf-8">
<!-- 6887-13 · CTA (integrado, Amin visible; 38,67–42,676 s). «comenta la palabra PLAN… te estaré enviando a la clase gratuita».
     Acción y desenlace: un comentario se escribe letra a letra (PLAN) y se envía; llega la respuesta con un vídeo (la clase).
     La palabra PLAN va aquí y NO como clave del subtítulo en ese tramo (no duplicar). Tiempos locales = propuesta − 38,67. -->
<style>
html,body{margin:0;background:transparent}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:-apple-system,"SF Pro Display",Helvetica,sans-serif;color:#fff}
.e{position:absolute;opacity:0}
#com{left:70px;top:290px;height:130px;padding:0 34px 0 22px;border-radius:65px;background:rgba(255,255,255,.97);color:#111;display:flex;align-items:center;box-shadow:0 18px 36px rgba(0,0,0,.5)}
#com .yo{width:86px;height:86px;border-radius:43px;background:#CFD6E0;margin-right:22px}
#txt{font-size:70px;font-weight:900;letter-spacing:3px;min-width:220px}
#cur{display:inline-block;width:6px;height:64px;background:#111;margin-left:6px;vertical-align:middle}
#env{width:76px;height:76px;border-radius:38px;background:#F5C542;margin-left:22px;position:relative;transform:scale(0)}
#env:after{content:"";position:absolute;left:24px;top:22px;border-left:34px solid #111;border-top:16px solid transparent;border-bottom:16px solid transparent}
#resp{left:70px;top:455px;width:300px;height:190px;border-radius:30px;background:#F5C542;box-shadow:0 18px 36px rgba(0,0,0,.5);overflow:hidden}
#resp .play{position:absolute;left:110px;top:55px;width:80px;height:80px;border-radius:40px;background:rgba(255,255,255,.95)}
#resp .play:after{content:"";position:absolute;left:31px;top:22px;border-left:28px solid #F5C542;border-top:18px solid transparent;border-bottom:18px solid transparent}
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="animaciones-casa.js"></script></head>
<body><div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="4.01">
<div id="com" class="e clip" data-start="0" data-duration="4.01"><div class="yo"></div><div id="txt"><span id="l"></span><i id="cur"></i></div><div id="env"></div></div>
<div id="resp" class="e clip" data-start="0" data-duration="4.01"><div class="play"></div></div>
</div>
<script>
const tl=gsap.timeline({paused:true}), A=0.05, L=document.getElementById("l");
casa.riseIn(tl,"#com",0.021,{tam:70});                              // «comenta»
["P","PL","PLA","PLAN"].forEach((s,i)=>tl.call(()=>{L.textContent=s},null,0.721-A+i*0.07));  // «plan» 0,721
tl.call(()=>{L.textContent=""},null,0); 
tl.to("#cur",{opacity:0,duration:0.05},1.05);
tl.to("#env",{scale:1.1,duration:0.1,ease:"power2.out"},1.08); tl.to("#env",{scale:1,duration:0.04},1.18);
casa.pop(tl,"#resp",2.303-A);                                       // «clase»
casa.float(tl,"#resp",2.4,4.0,5);
window.__timelines=window.__timelines||{};window.__timelines["root"]=tl;
</script></body></html>
