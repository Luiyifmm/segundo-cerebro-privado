<style>
html,body{margin:0;background:transparent}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:-apple-system,"SF Pro Display",Helvetica,sans-serif;color:#fff}
.e{position:absolute;opacity:0}

.f{position:absolute;left:24px;width:240px;height:64px;border-radius:16px;background:rgba(255,255,255,.96);color:#111;opacity:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box}

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="animaciones-casa.js"></script></head>
<body><div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="1.56">

 <svg id="pesa" viewBox="0 0 148 90"><rect x="6" y="20" width="22" height="50" rx="6" fill="#F5C542"/><rect x="30" y="10" width="22" height="70" rx="6" fill="#F5C542"/><rect x="52" y="38" width="44" height="14" rx="5" fill="#E9EEF5"/><rect x="96" y="10" width="22" height="70" rx="6" fill="#F5C542"/><rect x="120" y="20" width="22" height="50" rx="6" fill="#F5C542"/></svg>

<script>
const tl=gsap.timeline({paused:true}), A=0.05;
